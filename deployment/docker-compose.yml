# ── Chatsapp production stack ───────────────────────────────────
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: chatsapp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chatsapp}
      POSTGRES_DB: chatsapp
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatsapp"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    ports:
      - "80:80"
    depends_on:
      - server
    restart: unless-stopped

  server:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.ws
    environment:
      - DATABASE_URL=postgresql://chatsapp:${POSTGRES_PASSWORD:-chatsapp}@db:5432/chatsapp?schema=public
      - PORT=3001
      - CORS_ORIGIN=http://localhost:80
      - SMS_SIMULATION_DELIVERY=0
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "npx prisma db push --accept-data-loss && node dist/index.js"
    restart: unless-stopped

volumes:
  pgdata:
